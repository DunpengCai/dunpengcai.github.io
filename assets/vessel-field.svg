<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1250" viewBox="0 0 1100 1250" fill="none" role="img" aria-labelledby="aorta-title aorta-description">
  <title id="aorta-title">Aortic biology and RNA therapeutics</title>
  <desc id="aorta-description">Original conceptual vector artwork in warm gold and deep brown. A sweeping aortic arch with three upper branches is paired with a stylized RNA stem-loop. These artistic forms suggest the laboratory's areas of research; they are not anatomical measurements, molecular models, microscopy, or experimental results.</desc>
  <defs>
    <radialGradient id="field" cx="0" cy="0" r="1" gradientTransform="translate(577 486) rotate(104) scale(834 752)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4D3B1C"/>
      <stop offset=".49" stop-color="#30291C"/>
      <stop offset="1" stop-color="#1D1B16"/>
    </radialGradient>
    <linearGradient id="gold" x1="280" y1="1060" x2="731" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#AC7917"/>
      <stop offset=".32" stop-color="#E9AC20"/>
      <stop offset=".7" stop-color="#F1B82D"/>
      <stop offset="1" stop-color="#C58B17"/>
    </linearGradient>
    <linearGradient id="inner" x1="229" y1="460" x2="776" y2="723" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B57D14"/>
      <stop offset=".42" stop-color="#C99016"/>
      <stop offset=".68" stop-color="#AD7713"/>
      <stop offset="1" stop-color="#7D5916"/>
    </linearGradient>
    <linearGradient id="edge" x1="310" y1="950" x2="655" y2="201" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFDD86" stop-opacity=".2"/>
      <stop offset=".4" stop-color="#FFE7A4" stop-opacity=".82"/>
      <stop offset=".76" stop-color="#FFF0BF" stop-opacity=".95"/>
      <stop offset="1" stop-color="#FFD56C" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="rna" x1="-70" y1="-181" x2="40" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE9AB"/>
      <stop offset=".48" stop-color="#E9AC20"/>
      <stop offset="1" stop-color="#AA761C"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1250" gradientUnits="userSpaceOnUse">
      <stop offset=".65" stop-color="#1D1B16" stop-opacity="0"/>
      <stop offset=".84" stop-color="#1D1B16" stop-opacity=".19"/>
      <stop offset="1" stop-color="#1D1B16"/>
    </linearGradient>
    <pattern id="grain" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="7" r=".6" fill="#F1B82D" opacity=".13"/>
      <circle cx="24" cy="26" r=".45" fill="#FFE7A4" opacity=".08"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="36"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="10" dy="15" stdDeviation="15" flood-color="#100E09" flood-opacity=".5"/></filter>
    <path id="aorta" d="M281 1170C284 1063 321 983 324 875C327 779 271 705 267 603C264 526 248 471 272 398C302 307 388 251 481 251C592 251 679 318 707 416C735 512 705 615 716 735C728 865 774 970 782 1175"/>
    <path id="branch-one" d="M370 287C368 226 338 194 325 147C312 100 315 67 298 8"/>
    <path id="branch-two" d="M486 252C480 205 489 161 513 127C534 98 546 61 545 9"/>
    <path id="branch-three" d="M586 281C606 235 648 204 665 163C680 127 682 91 708 43"/>
  </defs>

  <rect width="1100" height="1250" fill="url(#field)"/>
  <rect width="1100" height="1250" fill="url(#grain)"/>
  <ellipse cx="518" cy="394" rx="225" ry="185" fill="#D29716" opacity=".09" filter="url(#glow)"/>

  <!-- Open contours are decorative forms, not a chart or a measurement grid. -->
  <g stroke="#C2912F" stroke-width="1" opacity=".12">
    <path d="M-38 501C53 425 82 271 228 202C361 139 407 190 454 95"/>
    <path d="M-18 541C96 446 124 300 253 239C378 180 433 211 477 130"/>
    <path d="M19 582C125 472 166 338 285 278"/>
    <path d="M1057 344C897 331 863 385 858 462C852 559 1018 612 1004 763C994 866 928 962 1014 1062"/>
    <path d="M1101 305C917 293 826 369 820 456"/>
    <path d="M1010 821C1047 901 1049 983 1114 1027"/>
  </g>

  <!-- The arch and branches use layered golden walls and fine inner highlights. -->
  <g stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)">
    <use href="#branch-one" stroke="url(#gold)" stroke-width="48"/>
    <use href="#branch-two" stroke="url(#gold)" stroke-width="37"/>
    <use href="#branch-three" stroke="url(#gold)" stroke-width="34"/>
    <use href="#aorta" stroke="url(#gold)" stroke-width="112"/>
  </g>
  <g stroke-linecap="round" stroke-linejoin="round">
    <use href="#branch-one" stroke="#9D6E17" stroke-opacity=".5" stroke-width="26"/>
    <use href="#branch-two" stroke="#9D6E17" stroke-opacity=".5" stroke-width="18"/>
    <use href="#branch-three" stroke="#9D6E17" stroke-opacity=".5" stroke-width="17"/>
    <use href="#aorta" stroke="url(#inner)" stroke-width="76"/>
    <use href="#aorta" stroke="#5F471A" stroke-opacity=".19" stroke-width="38"/>
  </g>
  <g stroke="url(#edge)" stroke-linecap="round">
    <path d="M253 1140C261 1023 294 978 297 875C300 777 244 701 241 603C239 525 225 462 246 390C280 283 376 225 479 225C604 224 702 304 732 409C764 516 734 614 744 730C756 860 799 953 808 1135" stroke-width="3"/>
    <path d="M353 269C353 214 323 180 312 139C300 98 301 62 286 17" stroke-width="2"/>
    <path d="M475 234C473 194 485 153 505 124C526 94 533 55 532 18" stroke-width="1.8"/>
    <path d="M578 267C595 226 635 196 651 158C665 126 670 87 694 46" stroke-width="1.8"/>
  </g>

  <!-- A stylized folded single RNA strand; no sequence or therapeutic mechanism is asserted. -->
  <g transform="translate(869 701) rotate(-23)">
    <ellipse cx="-16" cy="16" rx="102" ry="217" fill="#D99D24" opacity=".06" filter="url(#glow)"/>
    <path d="M-34 245V24C-34-20-77-53-78-106C-79-158-41-196 3-190C53-184 76-133 57-92C36-47 15-30 15 25V245" stroke="#17150F" stroke-opacity=".65" stroke-width="16"/>
    <path d="M-34 245V24C-34-20-77-53-78-106C-79-158-41-196 3-190C53-184 76-133 57-92C36-47 15-30 15 25V245" stroke="url(#rna)" stroke-width="5" stroke-linecap="round"/>
    <g stroke="#D6AD55" stroke-width="2" opacity=".7">
      <path d="M-31 38H12M-31 76H12M-31 114H12M-31 152H12M-31 190H12M-31 228H12"/>
    </g>
    <g fill="#F7CE6B" stroke="#594018" stroke-width="2">
      <circle cx="-34" cy="38" r="7"/><circle cx="15" cy="38" r="7"/>
      <circle cx="-34" cy="76" r="7"/><circle cx="15" cy="76" r="7"/>
      <circle cx="-34" cy="114" r="7"/><circle cx="15" cy="114" r="7"/>
      <circle cx="-34" cy="152" r="7"/><circle cx="15" cy="152" r="7"/>
      <circle cx="-34" cy="190" r="7"/><circle cx="15" cy="190" r="7"/>
      <circle cx="-34" cy="228" r="7"/><circle cx="15" cy="228" r="7"/>
      <circle cx="-39" cy="-3" r="7"/><circle cx="24" cy="-19" r="7"/>
      <circle cx="-63" cy="-54" r="7"/><circle cx="50" cy="-77" r="7"/>
      <circle cx="-78" cy="-107" r="7"/><circle cx="63" cy="-123" r="7"/>
      <circle cx="-58" cy="-163" r="7"/><circle cx="38" cy="-174" r="7"/>
      <circle cx="-7" cy="-190" r="7"/>
    </g>
    <g fill="#AE7133" opacity=".95"><circle cx="15" cy="76" r="4"/><circle cx="-34" cy="152" r="4"/><circle cx="-58" cy="-163" r="4"/></g>
  </g>

  <!-- Warm cell-like accents remain deliberately abstract. -->
  <g fill="#F8DB8C" opacity=".68">
    <ellipse cx="304" cy="834" rx="7" ry="13" transform="rotate(-8 304 834)"/>
    <ellipse cx="283" cy="562" rx="6" ry="11" transform="rotate(-6 283 562)"/>
    <ellipse cx="424" cy="257" rx="6" ry="11" transform="rotate(78 424 257)"/>
    <ellipse cx="674" cy="371" rx="6" ry="11" transform="rotate(-26 674 371)"/>
    <ellipse cx="722" cy="681" rx="7" ry="12" transform="rotate(-6 722 681)"/>
  </g>
  <g fill="#F1B82D" opacity=".7">
    <circle cx="166" cy="771" r="3"/><circle cx="193" cy="820" r="2"/>
    <circle cx="507" cy="662" r="3"/><circle cx="556" cy="708" r="2"/>
    <circle cx="927" cy="363" r="2.5"/><circle cx="976" cy="417" r="2"/>
  </g>

  <rect width="1100" height="1250" fill="url(#fade)"/>
  <g stroke="#E0BB61" stroke-width="1" opacity=".6">
    <path d="M63 110V63H110"/>
    <path d="M62 186H158L215 244"/>
    <circle cx="215" cy="244" r="3" fill="#E0BB61" stroke="none"/>
    <path d="M1038 1140V1188H991"/>
  </g>
  <g fill="#F1D796" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" letter-spacing="2.5">
    <text x="63" y="151" opacity=".87">AORTIC BIOLOGY</text>
    <text x="984" y="1008" text-anchor="end" font-size="12" opacity=".76">RNA THERAPEUTICS</text>
  </g>
</svg>
