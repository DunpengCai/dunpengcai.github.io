      <path d="M306 920C309 962 330 992 363 1017" stroke-width="5"/>
      <path d="M938 910C932 984 968 1034 1008 1078C1048 1122 1053 1171 1121 1205" stroke-width="17"/>
      <path d="M976 1039C910 1056 908 1105 875 1143C855 1167 833 1183 796 1189" stroke-width="6"/>
      <path d="M347 1051C349 1125 298 1172 289 1217C284 1238 288 1262 284 1287" stroke-width="9"/>
      <path d="M316 1147C253 1140 217 1166 187 1201" stroke-width="4"/>
      <path d="M308 427C337 367 326 309 283 282C237 253 189 266 156 219C124 173 130 127 95 96" stroke-width="9"/>
      <path d="M180 243C145 283 105 290 64 283C24 275-3 278-29 297" stroke-width="4"/>
      <path d="M603 241C564 192 541 145 549 93C555 56 544 23 530-17" stroke-width="8"/>
    </g>
    <g stroke="#b3b89b" opacity=".18" stroke-width="1.5">
      <path d="M132 702C118 754 153 801 141 857C131 906 89 935 62 965"/>
      <path d="M145 809C197 811 219 843 224 878"/>
      <path d="M496 838C452 869 463 931 505 956C537 976 549 992 554 1017"/>
      <path d="M715 661C756 673 790 649 829 669C869 689 862 744 899 769"/>
      <path d="M811 665C814 612 841 592 860 563"/>
      <path d="M354 164C406 148 431 115 436 75C441 35 463 16 482-8"/>
      <path d="M437 77C391 50 382 22 387-12"/>
    </g>
  </g>

  <!-- Broad vessel walls, then a narrow inner light. -->
  <g filter="url(#shadow)" stroke-linecap="round" stroke-linejoin="round">
    <use href="#upper-left" stroke="url(#branch)" stroke-width="31"/>
    <use href="#upper-crown" stroke="url(#branch)" stroke-width="36"/>
    <use href="#left-arm" stroke="url(#branch)" stroke-width="48"/>
    <use href="#right-crown" stroke="url(#branch)" stroke-width="53"/>
    <use href="#lower-left" stroke="url(#warm-branch)" stroke-width="47"/>
    <use href="#lower-right" stroke="url(#warm-branch)" stroke-width="56"/>
    <use href="#trunk" stroke="url(#vessel)" stroke-width="86"/>
  </g>
  <g stroke-linecap="round" stroke-linejoin="round">
    <use href="#upper-left" stroke="#233732" stroke-opacity=".34" stroke-width="15"/>
    <use href="#upper-crown" stroke="#233732" stroke-opacity=".4" stroke-width="20"/>
    <use href="#left-arm" stroke="#253c34" stroke-opacity=".4" stroke-width="29"/>
    <use href="#right-crown" stroke="#253c34" stroke-opacity=".42" stroke-width="34"/>
    <use href="#lower-left" stroke="#343f32" stroke-opacity=".35" stroke-width="29"/>
    <use href="#lower-right" stroke="#2c3d33" stroke-opacity=".4" stroke-width="35"/>
    <use href="#trunk" stroke="#31453c" stroke-opacity=".35" stroke-width="61"/>
  </g>

  <g stroke="url(#edge)" stroke-linecap="round">
    <path d="M692 1281C668 1167 667 1107 627 1016C586 920 556 873 566 771C579 659 513 603 465 522C411 432 434 349 380 277C327 208 251 164 226 90" stroke-width="3.5"/>
    <path d="M599 673C647 615 744 562 789 457C830 362 885 283 978 271" stroke-width="2.2"/>
    <path d="M438 315C506 281 551 282 599 229C645 179 668 109 732 64" stroke-width="1.8"/>
    <path d="M558 752C495 768 468 784 405 763C326 739 289 670 215 649C146 630 69 644 4 671" stroke-width="2"/>
    <path d="M645 931C718 888 752 861 822 867C907 875 969 915 1039 873" stroke-width="2.6"/>
    <path d="M654 1120C588 1090 562 1057 502 1030C426 995 340 1035 271 1063C195 1095 119 1097 67 1135" stroke-width="2"/>
    <path d="M455 476C397 455 341 453 300 416C244 365 190 336 114 343" stroke-width="1.5"/>
  </g>

  <!-- Cell-like shapes provide a warm, restrained counterpoint to the vessel walls. -->
  <g fill="url(#cell)">
    <ellipse cx="670" cy="1135" rx="11" ry="17" transform="rotate(-14 670 1135)"/>
    <ellipse cx="626" cy="965" rx="10" ry="15" transform="rotate(-28 626 965)"/>
    <ellipse cx="587" cy="832" rx="10" ry="16" transform="rotate(-2 587 832)"/>
    <ellipse cx="547" cy="614" rx="9" ry="14" transform="rotate(-31 547 614)"/>
    <ellipse cx="443" cy="393" rx="8" ry="12" transform="rotate(-10 443 393)"/>
    <ellipse cx="337" cy="199" rx="7" ry="12" transform="rotate(-43 337 199)"/>
    <ellipse cx="726" cy="554" rx="8" ry="12" transform="rotate(40 726 554)"/>
    <ellipse cx="865" cy="331" rx="6" ry="10" transform="rotate(46 865 331)"/>
    <ellipse cx="460" cy="783" rx="7" ry="11" transform="rotate(85 460 783)"/>
    <ellipse cx="224" cy="661" rx="6" ry="9" transform="rotate(-71 224 661)"/>
    <ellipse cx="826" cy="882" rx="9" ry="13" transform="rotate(-78 826 882)"/>
    <ellipse cx="419" cy="1033" rx="7" ry="11" transform="rotate(79 419 1033)"/>
