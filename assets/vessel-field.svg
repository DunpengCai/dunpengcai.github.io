<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1250" viewBox="0 0 1100 1250" fill="none" role="img" aria-labelledby="vascular-title vascular-description">
  <title id="vascular-title">A field of branching vessels</title>
  <desc id="vascular-description">An original conceptual illustration of a vascular network. Soft sage and bronze branches sweep through a charcoal field, with sparse burgundy cell-like forms and delicate secondary vessels. This is an artistic illustration, not experimental imaging or data.</desc>
  <defs>
    <radialGradient id="field" cx="0" cy="0" r="1" gradientTransform="translate(622 582) rotate(101) scale(853 755)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#263532"/>
      <stop offset=".57" stop-color="#1e2a29"/>
      <stop offset="1" stop-color="#172123"/>
    </radialGradient>
    <linearGradient id="vessel" x1="278" y1="41" x2="720" y2="1220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4a635b"/>
      <stop offset=".38" stop-color="#849080"/>
      <stop offset=".67" stop-color="#788277"/>
      <stop offset="1" stop-color="#9a8260"/>
    </linearGradient>
    <linearGradient id="branch" x1="1077" y1="261" x2="526" y2="820" gradientUnits="userSpaceOnUse">
      <stop stop-color="#40554f"/>
      <stop offset=".6" stop-color="#748273"/>
      <stop offset="1" stop-color="#8b8c75"/>
    </linearGradient>
    <linearGradient id="warm-branch" x1="-60" y1="1111" x2="1090" y2="832" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4e4e43"/>
      <stop offset=".48" stop-color="#938368"/>
      <stop offset="1" stop-color="#53665b"/>
    </linearGradient>
    <linearGradient id="edge" x1="321" y1="157" x2="787" y2="1153" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b9c2a8" stop-opacity=".15"/>
      <stop offset=".38" stop-color="#e2d9b6" stop-opacity=".66"/>
      <stop offset=".73" stop-color="#c4c9ae" stop-opacity=".34"/>
      <stop offset="1" stop-color="#dec18e" stop-opacity=".48"/>
    </linearGradient>
    <radialGradient id="cell" cx=".36" cy=".3" r=".7">
      <stop stop-color="#b77f72"/>
      <stop offset=".47" stop-color="#96554d"/>
      <stop offset="1" stop-color="#643b38"/>
    </radialGradient>
    <pattern id="grain" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="8" r=".6" fill="#d1c8a6" opacity=".12"/>
      <circle cx="25" cy="27" r=".45" fill="#d1c8a6" opacity=".09"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="7" dy="10" stdDeviation="13" flood-color="#0b1415" flood-opacity=".48"/>
    </filter>
    <path id="trunk" d="M718 1321C691 1202 693 1127 651 1028C609 929 577 872 588 770C600 660 532 594 482 511C431 427 457 348 398 265C345 190 273 155 245 83C227 38 219-9 211-64"/>
    <path id="right-crown" d="M574 694C626 621 727 587 780 472C830 364 879 289 982 261C1039 246 1082 223 1142 180"/>
    <path id="upper-crown" d="M430 328C493 292 552 295 609 235C660 182 673 116 742 62C782 30 799-10 815-67"/>
    <path id="left-arm" d="M585 753C505 761 478 795 402 774C321 752 296 683 213 658C142 636 79 642-52 693"/>
    <path id="upper-left" d="M470 483C400 457 348 467 301 426C240 373 195 345 111 353C51 358 3 351-52 328"/>
    <path id="lower-right" d="M629 953C698 914 744 869 825 879C913 890 963 932 1045 886C1093 859 1126 843 1170 842"/>
    <path id="lower-left" d="M684 1140C615 1120 564 1069 502 1043C416 1006 334 1050 271 1075C192 1107 126 1104 55 1147C5 1178-18 1200-57 1211"/>
  </defs>

  <rect width="1100" height="1250" fill="url(#field)"/>
  <rect width="1100" height="1250" fill="url(#grain)"/>

