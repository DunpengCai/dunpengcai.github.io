  <g filter="url(#soft)" opacity=".13" stroke="#aab9aa" stroke-linecap="round">
    <path d="M-80 980C119 862 93 721 237 590S451 386 494 141" stroke-width="42"/>
    <path d="M1070 1220C919 1069 1024 916 916 717S922 401 1103 349" stroke-width="38"/>
    <path d="M833-33C859 144 1076 190 1090 416" stroke-width="20"/>
  </g>

