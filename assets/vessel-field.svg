  <g fill="#c0a15c">
    <circle cx="600" cy="743" r="3.5" opacity=".9"/>
    <circle cx="649" cy="1015" r="3" opacity=".8"/>
    <circle cx="487" cy="527" r="2.8" opacity=".85"/>
    <circle cx="757" cy="513" r="2.7" opacity=".8"/>
    <circle cx="526" cy="1064" r="2.4" opacity=".7"/>
  </g>

  <!-- Editorial markers: no measurements, axes, or simulated findings. -->
  <g stroke="#b8ad8b" stroke-width="1" opacity=".5">
    <path d="M62 110V62H110"/>
    <path d="M1038 1140V1188H990"/>
    <path d="M64 1188H117"/>
  </g>
  <g fill="#d1c7aa" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" letter-spacing="2.5">
    <text x="64" y="143" opacity=".76">FORM · FLOW · FUNCTION</text>
    <text x="1036" y="1220" text-anchor="end" font-size="10" letter-spacing="2" opacity=".57">CONCEPTUAL ILLUSTRATION</text>
  </g>
</svg>
